services:
  postgres:
    image: postgres:16-alpine
    container_name: promotor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promotor_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d promotor_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: promotor-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: promotor-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minio minio123; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/promotor-dev;
      /usr/bin/mc anonymous set download local/promotor-dev;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
